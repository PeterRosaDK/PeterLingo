name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tools/requirements-data.txt
      - run: npm run test:datasets
      - run: python tools/phonetics-dataset/generate.py --validate
      - run: python -m unittest discover -s tools/phonetics-dataset
      - run: npm run typecheck:functions
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e
